# ===================================================================
# BIZPOS CONFIGURATION TEMPLATE (EXAMPLE)
# Sao chép file này thành application.properties hoặc cấu hình biến môi trường
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=BizPOS

# Database Configuration (MySQL)
# Khuyến nghị truyền qua biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/bizpos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_database_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# JWT Security Configuration
# BẮT BUỘC: Khởi tạo chuỗi bí mật ngẫu nhiên tối thiểu 256 bits (HMAC-SHA256) cho Production
# Không dùng chuỗi mặc định trên môi trường triển khai thực tế!
jwt.secret=your_strong_random_256_bit_jwt_secret_key_here
jwt.expiration-ms=86400000

# VietQR Bank Payment Configuration
# Cấu hình thông tin tài khoản ngân hàng thụ hưởng của cửa hàng tại quầy POS
bizpos.payment.bank.bank-id=VietinBank
bizpos.payment.bank.account-no=000000000000
bizpos.payment.bank.account-name=BIZPOS STORE
bizpos.payment.bank.template=compact2

# Data Initialization
# Đặt false trên môi trường Production để không tự động nạp dữ liệu mẫu
bizpos.init-data.enabled=false

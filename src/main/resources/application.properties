# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=BizPOS

# Database Configuration (MySQL)
# Khuyến nghị sử dụng biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bizpos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# JWT Security Configuration
# CẢNH BÁO: Bắt buộc cấu hình biến môi trường JWT_SECRET trong môi trường Production (tối thiểu 256 bits).
jwt.secret=${JWT_SECRET:BizPOS_Default_Development_Secret_Key_Minimum_256_Bits_Super_Secret_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# VietQR Bank Payment Configuration
bizpos.payment.bank.bank-id=${BANK_ID:VietinBank}
bizpos.payment.bank.account-no=${BANK_ACCOUNT_NO:000000000000}
bizpos.payment.bank.account-name=${BANK_ACCOUNT_NAME:BIZPOS STORE}
bizpos.payment.bank.template=compact2

# Data Initialization
bizpos.init-data.enabled=${INIT_DATA_ENABLED:true}
